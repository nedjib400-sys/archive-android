<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الأرشيف - مزامنة الواي فاي المحلية</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1, h2 {
            color: #2c3e50;
            text-align: center;
        }
        .card {
            background: #f8f9fa;
            border: 1px solid #ddd;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 6px;
        }
        input, button {
            padding: 10px;
            margin: 5px 0;
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #2980b9;
        }
        .status {
            padding: 10px;
            margin-top: 10px;
            border-radius: 4px;
            text-align: center;
            font-weight: bold;
        }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
        ul {
            padding-right: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>نظام الأرشيف المحلي (مزامنة Wi-Fi)</h1>
    
    <!-- لوحة التحكم / إعدادات الاتصال -->
    <div class="card">
        <h2>إعدادات الاتصال بشبكة الواي فاي</h2>
        <label for="serverIp">عنوان IP الخاص بهاتف المدير (الخادم):</label>
        <input type="text" id="serverIp" value="http://192.168.1.100:8765" placeholder="مثال: http://192.168.1.50:8765">
        <button onclick="testConnection()">اختبار الاتصال بالمدير</button>
        <div id="connectionStatus" class="status" style="display:none;"></div>
    </div>

    <!-- لوحة إضافة/عرض البيانات -->
    <div class="card">
        <h2>سجلات الأرشيف</h2>
        <input type="text" id="docTitle" placeholder="عنوان الوثيقة أو السجل الجديد...">
        <button onclick="addNewRecord()">إضافة وحفظ السجل (مزامنة فورية)</button>
        <button onclick="fetchArchiveData()" style="background-color: #2ecc71;">جلب وتحديث البيانات من المدير</button>
        
        <h3>قائمة السجلات الحالية:</h3>
        <ul id="recordsList">
            <li>جاري تحميل السجلات...</li>
        </ul>
    </div>
</div>

<script>
    // الحصول على عنوان الخادم المدخل
    function getServerUrl() {
        return document.getElementById('serverIp').value.trim();
    }

    // اختبار الاتصال بالخادم المحلي على شبكة Wi-Fi
    async function testConnection() {
        const statusDiv = document.getElementById('connectionStatus');
        statusDiv.style.display = 'block';
        statusDiv.className = 'status';
        statusDiv.innerText = 'جاري اختبار الاتصال...';

        try {
            const response = await fetch(`${getServerUrl()}/api/status`, { method: 'GET' });
            if (response.ok) {
                statusDiv.className = 'status success';
                statusDiv.innerText = 'تم الاتصال بنجاح بهاتف المدير عبر شبكة Wi-Fi!';
            } else {
                throw new Error('استجابة غير صالحة');
            }
        } catch (error) {
            statusDiv.className = 'status error';
            statusDiv.innerText = 'فشل الاتصال! تأكد من أن الهاتف والكمبيوتر على نفس شبكة Wi-Fi وأن التطبيق يعمل.';
        }
    }

    // جلب البيانات من هاتف المدير
    async function fetchArchiveData() {
        try {
            const response = await fetch(`${getServerUrl()}/api/data`);
            if (!response.ok) throw new Error('تعذر جلب البيانات');
            const data = await response.json();
            
            const list = document.getElementById('recordsList');
            list.innerHTML = '';
            
            if (data.length === 0) {
                list.innerHTML = '<li>لا توجد سجلات مسجلة بعد.</li>';
                return;
            }

            data.forEach(record => {
                const li = document.createElement('li');
                li.innerText = record.title + ' (تاريخ الإضافة: ' + (record.date || 'غير محدد') + ')';
                list.appendChild(li);
            });
            alert('تم تحديث البيانات بنجاح من هاتف المدير!');
        } catch (error) {
            alert('خطأ في جلب البيانات: تأكد من عنوان الـ IP والاتصال بالشبكة المحلية.');
        }
    }

    // إضافة سجل جديد وإرساله لهاتف المدير
    async function addNewRecord() {
        const titleInput = document.getElementById('docTitle');
        const title = titleInput.value.trim();
        
        if (!title) {
            alert('الرجاء إدخال عنوان السجل أولاً.');
            return;
        }

        const newRecord = {
            title: title,
            date: new Date().toLocaleString()
        };

        try {
            const response = await fetch(`${getServerUrl()}/api/save`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(newRecord)
            });

            if (response.ok) {
                alert('تم حفظ السجل ومزامنته مع هاتف المدير بنجاح!');
                titleInput.value = '';
                fetchArchiveData(); // تحديث القائمة فوراً
            } else {
                throw new Error('فشل الحفظ');
            }
        } catch (error) {
            alert('تعذر إرسال البيانات إلى هاتف المدير. تحقق من اتصال الواي فاي.');
        }
    }

    // تحميل البيانات تلقائياً عند فتح الصفحة
    window.onload = function() {
        // يمكن تفعيل الجلب التلقائي عند الاتصال
    };
</script>

</body>
</html>
