<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Archive</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f3f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .box {
      background: white;
      padding: 35px;
      border-radius: 12px;
      width: 380px;
      text-align: center;
      box-shadow: 0 3px 15px #0002;
    }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 13px;
      margin-top: 15px;
      font-size: 16px;
      border-radius: 7px;
    }
    input { border: 1px solid #bbb; }
    button {
      background: #1769aa;
      color: white;
      border: 0;
      cursor: pointer;
    }
    #status { margin-top: 18px; }
  </style>
</head>
<body>
  <div class="box">
    <h2>أرشيف</h2>
    <p>اتصل بتطبيق الهاتف لمزامنة البيانات</p>
    <input id="address" placeholder="http://192.168.1.5:8765">
    <button onclick="connect()">اتصال بالهاتف</button>
    <p id="status"></p>
  </div>

  <script>
    async function connect() {
      const address = document.getElementById('address').value.trim();
      const status = document.getElementById('status');

      try {
        status.textContent = 'جارٍ الاتصال...';
        await window.archiveDesktop.connect(address);
        status.textContent = 'تم الاتصال';
      } catch (error) {
        status.textContent = 'تعذر الاتصال: ' + error.message;
      }
    }
  </script>
</body>
</html>
