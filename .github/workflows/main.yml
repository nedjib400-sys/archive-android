name: Build HTML to Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. سحب الكود من المستودع
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. إعداد بيئة جافا (مطلوبة لتجميع تطبيقات أندرويد)
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. إعداد أداة Cordova لإنشاء وتغليف تطبيق أندرويد من ملفات الويب
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Cordova and Android builder tools
        run: |
          npm install -g cordova
          cordova create myApp com.example.archive "أرشيف أندرويد"
          cd myApp
          # نسخ ملفات الـ HTML الخاصة بك إلى مجلد التطبيق
          cp -r ../* www/ 2>/dev/null || :
          cordova platform add android

      # 4. بناء ملف الـ APK النهائي
      - name: Build APK
        run: |
          cd myApp
          cordova build android --debug

      # 5. رفع ملف الـ APK الناتج لكي يظهر زر التحميل في قسم Artifacts
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-app-debug
          path: myApp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          
