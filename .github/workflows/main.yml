name: Build and Package Web HTML

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. سحب الكود من المستودع
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. ضغط ملفات الـ HTML والمشروع في ملف Zip واحد
      - name: Compress files to ZIP
        run: |
          zip -r website-files.zip . -x ".git/*"

      # 3. رفع الملف الناتج لكي يظهر زر التحميل في صفحة GitHub Actions
      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: html-website-package
          path: website-files.zip
          
