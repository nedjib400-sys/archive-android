name: Build Desktop App EXE

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Desktop Package ZIP
        run: |
          # ضغط المشروع في ملف ZIP مخصص لإصدار سطح المكتب
          Compress-Archive -Path * -DestinationPath archive-windows-desktop.zip -Force

      - name: Upload Desktop Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-app
          path: archive-windows-desktop.zip
          
