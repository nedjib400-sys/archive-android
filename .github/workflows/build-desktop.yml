name: Build Desktop App EXE

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies and builder
        run: |
          npm install
          npm install -g pkg

      - name: Compile to Windows EXE
        run: |
          pkg . --targets node18-win-x64 --output archive-desktop.exe

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-app
          path: archive-desktop.exe
          
