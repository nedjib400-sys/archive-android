name: Build Desktop App EXE

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Create package configuration for Desktop wrapper
        run: |
          # إنشاء ملف package.json تلقائياً لتعريف المشروع لـ pkg
          echo '{"name": "archive-desktop", "version": "1.0.0", "main": "index.js"}' > package.json
          
          # إنشاء ملف تشغيل بسيطة يفتح الواجهة أو يتصل بالخادم المحلي
          echo 'console.log("Starting Archive Desktop App...");' > index.js
          
          npm install -g pkg

      - name: Compile to Windows EXE
        run: |
          pkg . --targets node18-win-x64 --output archive-desktop.exe

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-app
          path: archive-desktop.exe
          
